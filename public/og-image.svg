<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f5f3ed"/>

  <!-- Diamond mark centered, larger -->
  <g transform="translate(600,240)">
    <polygon points="0,-110 110,0 0,110 -110,0" fill="#1a5d3a"/>
    <polygon points="0,-66 66,0 0,66 -66,0" fill="none" stroke="#f5f3ed" stroke-width="3"/>
  </g>

  <!-- Wordmark below diamond -->
  <text x="600" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#1a1a1a" letter-spacing="-0.5">Game</text>
  <text x="780" y="420" text-anchor="start" font-family="Georgia, serif" font-size="56" font-weight="700" font-style="italic" fill="#1a5d3a" letter-spacing="-0.5">Model.</text>

  <!-- Tagline -->
  <text x="600" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#8a8a8a">Manažment futbalového klubu</text>

  <!-- Subtle border line -->
  <rect x="48" y="48" width="1104" height="534" rx="8" fill="none" stroke="rgba(26,26,26,0.06)" stroke-width="1.5"/>
</svg>
